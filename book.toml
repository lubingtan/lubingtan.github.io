[book]
title = "Bingtan's Wiki"
authors = ["lubingtan"]
language = "en"

[preprocessor.blog]
command = "tools/blog-preprocessor.py"
[preprocessor.graph]
command = "tools/graph-preprocessor.py"
[preprocessor.mermaid]
command = "bin/mdbook-mermaid"
[build]
create-missing = true
[output.html]
no-section-label = true
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
definition-lists = true
admonitions = true
mathjax-support = false
git-repository-url = "https://github.com/lubingtan/lubingtan.github.io"
edit-url-template = "https://github.com/lubingtan/lubingtan.github.io/edit/main/{path}"
git-repository-icon = "fab-github"
additional-js = ["theme/giscus.js", "theme/goatcounter.js", "theme/mermaid.min.js", "theme/mermaid-init.js"]
[output.html.fold]
enable = true    # whether or not to enable section folding
level = 0