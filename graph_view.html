agent-sandbox"}, {"source": "Cloud_Native/AI_Infrastructure/agent-substrate", "target": "Cloud_Native/AI_Infrastructure/kagent"}, {"source": "Cloud_Native/AI_Infrastructure/agent-substrate", "target": "Cloud_Native/AI_Infrastructure/agent-sandbox"}, {"source": "Cloud_Native/AI_Infrastructure/cordis-hello-world.assets/README", "target": "Cloud_Native/AI_Infrastructure/cordis"}];
  const colors = {"Cloud Native / AI Infrastructure": "#326ce5", "Cloud Native / CICD": "#4caf50", "Cloud Native / Cluster Lifecycle": "#ff9800", "Cloud Native / Kubernetes": "#f44336", "Cloud Native / Linux Container": "#9c27b0", "Distributed Systems / mesos.md": "#00bcd4", "Machine Learning / High Performance Computing": "#ff5722", "Machine Learning / Inference": "#607d8b", "Operation / Development Environment": "#8bc34a", "Operation / Linux": "#e91e63"};
  const defaultColor = '#9e9e9e';

  const container = document.getElementById('graph-container');
  const width = container.clientWidth || 800;
  const height = 580;

  // compute radius from degree
  nodes.forEach(d => {
    d.radius = Math.max(8, Math.min(28, 8 + d.degree * 2.5));
    d.color = colors[d.category] || defaultColor;
  });

  const svg = d3.select('#graph-container')
    .append('svg')
    .attr('viewBox', [0, 0, width, height])
    .attr('width', width)
    .attr('height', height)
    .attr('style', 'max-width:100%;height:auto;');

  const zoomGroup = svg.append('g');

    .data(['arrow'])
    .join('marker')
    .attr('id', 'arrow')
    .attr('viewBox', '0 -5 10 10')
    .attr('refX', 20)
    .attr('refY', 0)
    .attr('markerWidth', 6)
    .attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,-5L10,0L0,5')
    .attr('fill', '#bbb');

  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(d => d.id).distance(120))
    .force('charge', d3.forceManyBody().strength(-400))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => d.radius + 4));

    .attr('stroke-width', 1.5)

    .selectAll('text')
    .data(nodes)
    .join('text')
    .text(d => d.name.length > 12 ? d.name.slice(0, 12) + '…' : d.name)
    .attr('font-size', 10)
    .attr('text-anchor', 'middle')
    .attr('dy', d => -d.radius - 4)
    .attr('fill', '#333')
    .attr('pointer-events', 'none');

    .scaleExtent([0.15, 4])
    .on('zoom', (event) => {

      const k = event.transform.k;

      node.attr('stroke-width', 1.5 / k);
      label.attr('font-size', Math.max(3, 10 / k) + 'px');
      label.attr('dy', d => (-d.radius / k) - 3);
      link.attr('stroke-width', 1.2 / k);
    });
  svg.call(zoom);

  // tooltip
  const tooltip = d3.select('body').append('div')
    .style('position', 'absolute')
    .style('padding', '4px 10px')
    .style('background', 'rgba(0,0,0,0.75)')
    .style('color', '#fff')
    .style('border-radius', '4px')
    .style('font-size', '12px')
    .style('pointer-events', 'none')
    .style('opacity', 0)
    .style('z-index', 9999);

           .style('top', (event.pageY - 20) + 'px');
  });
  node.on('mouseleave', () => {
    tooltip.style('opacity', 0);

  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);
    node
      .attr('cx', d => d.x)
      .attr('cy', d => d.y);
    label
      .attr('x', d => d.x)
      .attr('y', d => d.y);
  });

  node.call(d3.drag()
    .on('start', (event, d) => {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    })
    .on('drag', (event, d) => {
      d.fx = event.x;
      d.fy = event.y;
    })
    .on('end', (event, d) => {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }));

  // legend
  const legend = d3.select('#graph-legend');
  const catEntries = Object.entries(colors);
  catEntries.forEach(([cat, color]) => {
    const item = legend.append('span')
      .style('display', 'inline-flex')
      .style('align-items', 'center')
      .style('gap', '4px');
    item.append('span')
      .style('display', 'inline-block')
      .style('width', '10px')
      .style('height', '10px')
      .style('border-radius', '50%')
      .style('background', color);
    item.append('span').text(cat);
  });
  if (catEntries.length === 0) {
    legend.style('display', 'none');
  }
})();
